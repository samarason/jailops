apiVersion: jailops/v1
kind: Jail
hosts: [nas1]
start: true
metadata:
  name: plex
  labels: {tier: media}
spec:
  image: freebsd-15@stable
  storage: bulk               # the jail's own datasets (root, /usr/local, /var/db) live on the big pool
  network:
    - {name: eth0, network: media, ipv4: auto}
  firewall: {policies: [media-server]}
  resources: {cpu: 4, memory: 8G}
  volumes:
    # A volume of the project (volumes/plexdata.yaml), on `bulk`: it has its own snapshots and outlives the jail.
    - {volume: plexdata, mount: /var/db/plexdata}
    # The archive is NOT JailOps's data: two directories of the host (volumes/movies.yaml, music.yaml), mounted
    # read-only. They are not snapshotted or backed up by JailOps.
    - {volume: movies, mount: /mnt/movies, read_only: true}
    - {volume: music, mount: /mnt/music, read_only: true}
